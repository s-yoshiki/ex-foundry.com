<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title description">
  <title id="title">クソゲーの森のゲームレジストリと描画方式の分岐</title>
  <desc id="description">ゲームレジストリから静的な一覧を生成し、ゲームごとにPhaserまたはDOMをブラウザで読み込む構成図</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="7" refY="4" viewBox="0 0 8 8">
      <path d="M0 0L8 4L0 8Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="960" height="380" rx="24" fill="#f8fafc" />
  <text x="40" y="42" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">クソゲーの森の描画方式</text>
  <text x="40" y="68" fill="#64748b" font-family="sans-serif" font-size="14">共通レジストリから一覧を作り、ゲームの性質に合う実行方式を選ぶ</text>

  <rect x="40" y="125" width="220" height="105" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="150" y="161" fill="#1e3a8a" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Game registry</text>
  <text x="150" y="190" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">slug / title / renderer</text>
  <text x="150" y="212" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">SSR・一覧はメタデータのみ</text>

  <line x1="260" x2="365" y1="177" y2="177" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365" y="125" width="190" height="105" rx="15" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
  <text x="460" y="161" fill="#854d0e" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">SSG / SSR</text>
  <text x="460" y="190" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">一覧・操作説明</text>
  <text x="460" y="212" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">ゲームエンジンを初期化しない</text>

  <line x1="555" x2="650" y1="177" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="579" y="139" fill="#64748b" font-family="sans-serif" font-size="12">client load</text>
  <rect x="650" y="90" width="270" height="105" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
  <text x="785" y="126" fill="#9a3412" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Phaser / Canvas</text>
  <text x="785" y="155" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">ゲームループ・衝突・座標</text>
  <text x="785" y="177" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">必要なページだけ読み込む</text>

  <line x1="555" x2="650" y1="177" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="579" y="251" fill="#64748b" font-family="sans-serif" font-size="12">client load</text>
  <rect x="650" y="230" width="270" height="105" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="785" y="266" fill="#065f46" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">React / DOM</text>
  <text x="785" y="295" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">盤面・フォーカス・キーボード</text>
  <text x="785" y="317" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">Workerは探索処理を分離</text>
</svg>
