<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title description">
  <title id="title">NPB Analysisのデータ取り込みと検索経路</title>
  <desc id="description">公開ページから取得したデータをパースしてSQLiteへ保存し、SSR loaderとAPIが読み取る構成図</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="7" refY="4" viewBox="0 0 8 8">
      <path d="M0 0L8 4L0 8Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="960" height="380" rx="24" fill="#f8fafc" />
  <text x="40" y="42" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">NPB Analysisのデータ経路</text>
  <text x="40" y="68" fill="#64748b" font-family="sans-serif" font-size="14">取り込み側と読み取り側をSQLiteでつなぎ、SSRとAPIの結果を揃える</text>

  <rect x="40" y="115" width="180" height="90" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
  <text x="130" y="151" fill="#9a3412" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">公開ページ</text>
  <text x="130" y="178" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">選手・成績</text>
  <line x1="220" x2="295" y1="160" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="295" y="115" width="180" height="90" rx="15" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
  <text x="385" y="151" fill="#854d0e" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">取得・パース</text>
  <text x="385" y="178" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">検証して更新</text>
  <line x1="475" x2="550" y1="160" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="550" y="115" width="180" height="90" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="640" y="151" fill="#1e3a8a" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">SQLite</text>
  <text x="640" y="178" fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">プロフィール・成績</text>

  <line x1="640" x2="640" y1="205" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="238" fill="#64748b" font-family="sans-serif" font-size="12">共有して読み取り</text>
  <rect x="430" y="260" width="180" height="75" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="520" y="291" fill="#065f46" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">SSR loader</text>
  <text x="520" y="316" fill="#334155" font-family="sans-serif" font-size="13" text-anchor="middle">初期HTML</text>
  <rect x="650" y="260" width="180" height="75" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="740" y="291" fill="#065f46" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">検索API</text>
  <text x="740" y="316" fill="#334155" font-family="sans-serif" font-size="13" text-anchor="middle">構造化JSON</text>
  <line x1="640" x2="520" y1="220" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" x2="740" y1="220" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
</svg>
