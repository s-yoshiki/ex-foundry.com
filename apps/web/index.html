    <!--
      Resolves the theme before the first paint so the page never flashes the
      wrong palette. The storage key mirrors THEME_STORAGE_KEY in
      src/features/theme/functions/theme-preference.ts.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("ex-foundry:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
