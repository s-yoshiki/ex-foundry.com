  <body>
    <main class="page">

        <span class="brand-mark" aria-hidden="true">EX</span>

      <!-- サイトを追加するときは、この li を複製して書き換えます。 -->
      <ul class="app-list">
        <li>
          <a href="https://devtoys.ex-foundry.com/" class="app">

            <span class="app-desc">開発でよく使う変換・生成ツールをブラウザだけで。</span>

        <li>
          <div class="app app-soon" aria-disabled="true">
            <span class="app-name">Maker</span>
            <span class="app-host">maker.ex-foundry.com</span>
            <span class="app-desc">準備中。</span>
            <span class="app-badge">Coming soon</span>
          </div>
        </li>

      <footer class="site-footer">
        <a href="https://github.com/s-yoshiki" target="_blank" rel="noreferrer">
