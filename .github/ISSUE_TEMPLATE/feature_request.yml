name: Feature request
description: 新しい機能や改善を提案する
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 誰が、どのような状況で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する変更
      description: 期待する挙動やUIを記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別の方法があれば記載してください。
